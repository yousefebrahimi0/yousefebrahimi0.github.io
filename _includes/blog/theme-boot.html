<script>
/* Runs before CSS paints: stored choice wins, otherwise follow the OS. Keeps the page from flashing the wrong theme. */
(function () {
  var t;
  try { t = localStorage.getItem('yu-blog-theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') {
    t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
